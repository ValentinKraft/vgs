[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gs-viewer"
version = "0.1.0"
description = "Standalone Gaussian PLY viewer (OpenGL)"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "plyfile>=1.0.3",
  "glfw>=2.7.0",
  "PyOpenGL>=3.1.7",
  "imgui[glfw]>=2.0.0",
]

[project.scripts]
gs-viewer = "gs_viewer.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
